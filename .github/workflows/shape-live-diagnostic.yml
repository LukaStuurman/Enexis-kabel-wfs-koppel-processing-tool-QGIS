name: Live Enexis SHAPE diagnostic

on:
  push:
    branches:
      - debug/live-shape-download
  pull_request:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:4.2.0-questing

    steps:
      - uses: actions/checkout@v4

      - name: Inspect Spotler response and test ZIP with GDAL OGR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import os
          import re
          import subprocess
          import tempfile
          import urllib.request
          import zipfile

          import shape_archive

          url = shape_archive.SHAPE_DOWNLOAD_URL
          print('REQUEST_URL=', url)
          req = urllib.request.Request(
              url,
              headers={
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
                  'Accept': 'application/zip, application/octet-stream, text/html;q=0.9, */*;q=0.8',
                  'Accept-Language': 'nl-NL,nl;q=0.9,en;q=0.8',
              },
          )
          with urllib.request.urlopen(req, timeout=90) as response:
              print('STATUS=', getattr(response, 'status', None))
              print('FINAL_URL=', response.geturl())
              for key in ('Content-Type', 'Content-Length', 'Content-Disposition', 'Location'):
                  print(key.upper().replace('-', '_') + '=', response.headers.get(key))
              first = response.read(8192)
          print('FIRST_32_HEX=', first[:32].hex())
          print('ZIP_MAGIC=', first.startswith(b'PK\x03\x04'))
          if not first.startswith(b'PK\x03\x04'):
              text = first.decode('utf-8', errors='replace')
              compact = re.sub(r'\s+', ' ', html.unescape(text))
              print('BODY_PREVIEW=', compact[:2000])
              urls = re.findall(r'https?://[^\s\"\'<>]+', text)
              print('URL_CANDIDATES=', urls[:20])
              raise SystemExit('Spotler response is not a ZIP; diagnostic above shows the actual response.')

          with tempfile.TemporaryDirectory() as temp_dir:
              archive_path = os.path.join(temp_dir, 'enexis.zip')
              extracted = os.path.join(temp_dir, 'extracted')
              print('FULL_DOWNLOAD_START')
              shape_archive.download_archive(archive_path)
              print('FULL_DOWNLOAD_BYTES=', os.path.getsize(archive_path))
              print('ZIPFILE_VALID=', zipfile.is_zipfile(archive_path))
              shapes = shape_archive.extract_target_folder(archive_path, extracted)
              print('NOORD_SHP=', shapes['noord'])
              print('ZUID_SHP=', shapes['zuid'])
              for region in ('noord', 'zuid'):
                  shp = shapes[region]
                  result = subprocess.run(
                      ['ogrinfo', '-ro', '-so', '-al', shp],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      timeout=180,
                  )
                  print('OGRINFO_' + region.upper() + '_RC=', result.returncode)
                  print('OGRINFO_' + region.upper() + '_OUT=', result.stdout[:5000])
                  if result.returncode != 0:
                      raise SystemExit('ogrinfo failed for ' + region)
          PY
