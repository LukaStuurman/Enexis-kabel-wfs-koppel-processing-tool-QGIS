name: Windows SHAPE path compatibility

on:
  push:
  pull_request:

jobs:
  windows-shape-path:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run SHAPE archive tests on Windows
        run: python -m unittest tests.test_shape_archive -v
