name: QGIS 4.2 compatibility

on:
  push:
  pull_request:

jobs:
  qgis42:
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:4.2.0-questing

    steps:
      - uses: actions/checkout@v4

      - name: Pure Python tests
        run: python3 -m unittest discover -s tests -v

      - name: QGIS 4.2 plugin import smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/qgis-plugin-test
          mkdir -p /tmp/qgis-plugin-test/enexiskabel
          cp -R . /tmp/qgis-plugin-test/enexiskabel/
          PYTHONPATH=/tmp/qgis-plugin-test python3 - <<'PY'
          from qgis.core import QgsApplication, Qgis

          app = QgsApplication([], False)
          app.initQgis()

          from enexiskabel.algorithm import KoppelWfsCsvAlgorithm
          from enexiskabel.algorithm_auto import KoppelWfsCsvAutoAlgorithm
          from enexiskabel.provider import EnexisKabelProvider

          assert Qgis.QGIS_VERSION_INT >= 40200, Qgis.QGIS_VERSION

          algorithm = KoppelWfsCsvAutoAlgorithm()
          algorithm.initAlgorithm()
          assert algorithm.name() == "koppel_enexis_wfs_kabels_automatisch_aan_csv"
          assert len(algorithm.parameterDefinitions()) == 4

          provider = EnexisKabelProvider()
          provider.loadAlgorithms()
          assert len(provider.algorithms()) == 1

          app.exitQgis()
          print("QGIS 4.2 plugin smoke test OK")
          PY
