name: QGIS 4.2 compatibility

on:
  push:
  pull_request:

jobs:
  qgis42:
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:4.2.0-questing

    steps:
      - uses: actions/checkout@v4

      - name: Pure Python tests
        run: python3 -m unittest discover -s tests -v

      - name: QGIS 4.2 plugin smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/qgis-plugin-test
          mkdir -p /tmp/qgis-plugin-test/enexiskabel
          cp -R . /tmp/qgis-plugin-test/enexiskabel/
          mkdir -p /tmp/qgis-runtime
          chmod 700 /tmp/qgis-runtime
          QT_QPA_PLATFORM=offscreen XDG_RUNTIME_DIR=/tmp/qgis-runtime PYTHONPATH=/tmp/qgis-plugin-test:/usr/share/qgis/python python3 - <<'PY'
          from qgis.core import QgsApplication, QgsJsonUtils, Qgis

          app = QgsApplication([], False)
          app.initQgis()

          from enexiskabel.algorithm_source import KoppelWfsCsvAutoAlgorithm
          from enexiskabel.algorithm_dxf import SplitNaarDXF
          from enexiskabel.nationwide_fast import NationwideProcessor
          from enexiskabel.shape_archive import TARGET_FOLDER, SHAPE_DOWNLOAD_URL
          from enexiskabel.shape_nationwide import ShapeNationwideProcessor
          from enexiskabel.provider import EnexisKabelProvider

          assert Qgis.QGIS_VERSION_INT >= 40200, Qgis.QGIS_VERSION

          algorithm = KoppelWfsCsvAutoAlgorithm()
          algorithm.initAlgorithm()
          assert algorithm.name() == "koppel_enexis_wfs_kabels_automatisch_aan_csv"
          assert algorithm.TYPE_HINT == "asm_e_lv_map_cable"
          definitions = algorithm.parameterDefinitions()
          assert len(definitions) == 9, [p.name() for p in definitions]
          assert {p.name() for p in definitions} == {
              "CSV_FILE",
              "EXTENT",
              "CACHE_FOLDER",
              "OUTPUT",
              "UNMATCHED_CSV",
              "REFRESH_WFS_INDEX",
              "ONLY_MATCHED_OUTPUT",
              "NATIONWIDE_SOURCE",
              "REFRESH_SHAPE_DOWNLOAD",
          }
          assert algorithm.SOURCE_OPTIONS[0].startswith("WFS")
          assert "Noord" in algorithm.SOURCE_OPTIONS[1]
          assert "Zuid" in algorithm.SOURCE_OPTIONS[2]
          assert "Noord + Zuid" in algorithm.SOURCE_OPTIONS[3]
          assert TARGET_FOLDER == "imkl_elektriciteitskabel_e_lv_map_cable_ligging"
          assert SHAPE_DOWNLOAD_URL == (
              "https://enxp433-opendata-publications.s3.eu-west-1.amazonaws.com/"
              "Open_Asset_Data_Elektra.zip"
          )

          assert algorithm.MAX_EXTENT_LABEL_FEATURES == 10000
          assert NationwideProcessor.TILE_SIZE_M == 25000.0
          assert NationwideProcessor.MAX_TILE_WORKERS == 2

          processor = NationwideProcessor.__new__(NationwideProcessor)
          processor.algorithm = algorithm
          request_params = processor._params(
              "Enexis_Opendata:asm_e_lv_map_cable",
              "display_text",
              5001,
              bbox=(1, 100000, 400000, 125000, 425000),
          )
          assert "startIndex" not in request_params
          assert "sortBy" not in request_params
          assert request_params["propertyName"] == "display_text,geografischeligging"
          assert "bbox" in request_params
          children = NationwideProcessor._split_tile((1, 0, 0, 100, 100))
          assert len(children) == 4

          shape_processor = ShapeNationwideProcessor.__new__(ShapeNationwideProcessor)
          shape_processor.region_mode = "beide"
          selected = shape_processor._selected_paths({"noord": "n.shp", "zuid": "z.shp"})
          assert selected == [("noord", "n.shp"), ("zuid", "z.shp")]
          assert shape_processor._name_score("label") == 100
          assert shape_processor._name_score("kabelgroep") >= 80
          assert shape_processor._normalize_shape_label("Kabelgroep: TEST-01") == "TEST-01"
          assert shape_processor._normalize_shape_label("Kabelgroup: TEST-02") == "TEST-02"

          properties = {
              "object_id": 1,
              "display_text": "Kabelgroup: TEST-01",
          }
          assert algorithm._detect_label_field(properties) == "display_text"

          geometry_json = '{"type":"LineString","coordinates":[[100000,400000],[100010,400000]]}'
          geometry = QgsJsonUtils.geometryFromGeoJson(geometry_json)
          assert not geometry.isNull()
          assert round(geometry.length(), 2) == 10.0
          assert not geometry.isMultipart()
          geometry.convertToMultiType()
          assert geometry.isMultipart()
          assert round(geometry.length(), 2) == 10.0

          dxf = SplitNaarDXF()
          dxf.initAlgorithm()
          assert dxf.name() == "splitnaardxf_v5_kabelkoppeling"

          provider = EnexisKabelProvider()
          provider.loadAlgorithms()
          assert len(provider.algorithms()) == 2
          assert provider.algorithms()[0].__class__.__module__ == "enexiskabel.algorithm_source"

          app.exitQgis()
          print("QGIS 4.2 v0.15.2 smoke test OK")
          PY

      - name: Probe live Enexis SHAPE archive
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          import urllib.request

          from shape_archive import SHAPE_DOWNLOAD_URL

          last_error = None
          for attempt in range(3):
              try:
                  request = urllib.request.Request(
                      SHAPE_DOWNLOAD_URL,
                      headers={
                          "User-Agent": "Enexis-QGIS-v0152-CI-probe",
                          "Range": "bytes=0-63",
                          "Accept": "application/zip, application/octet-stream, */*",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = response.read(64)
                      content_type = response.headers.get("Content-Type", "")
                      content_range = response.headers.get("Content-Range", "")
                  if not data.startswith(b"PK\x03\x04"):
                      raise RuntimeError(
                          "Enexis SHAPE URL returned non-ZIP magic: " + data[:16].hex()
                      )
                  print("ENEXIS_SHAPE_URL=" + SHAPE_DOWNLOAD_URL)
                  print("ENEXIS_SHAPE_CONTENT_TYPE=" + content_type)
                  print("ENEXIS_SHAPE_CONTENT_RANGE=" + content_range)
                  print("ENEXIS_SHAPE_ZIP_MAGIC=true")
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 2:
                      raise
                  time.sleep(2 ** attempt)
          PY

      - name: Probe live Enexis WFS GeoPackage output
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          base = "https://opendata.enexis.nl/geoserver/wfs"
          capabilities_url = base + "?" + urllib.parse.urlencode({
              "service": "WFS",
              "version": "2.0.0",
              "request": "GetCapabilities",
          })
          with urllib.request.urlopen(capabilities_url, timeout=30) as response:
              root = ET.fromstring(response.read())
          names = []
          for feature_type in root.findall(".//{*}FeatureType"):
              node = feature_type.find("{*}Name")
              if node is not None and node.text:
                  names.append(node.text.strip())
          matches = [name for name in names if "e_lv_map_cable" in name.lower()]
          if not matches:
              raise RuntimeError("e_lv_map_cable niet gevonden in GetCapabilities")
          exact = [
              name for name in matches
              if name.split(":")[-1].lower() == "asm_e_lv_map_cable"
          ]
          type_name = min(exact or matches, key=lambda value: (len(value), value))
          params = {
              "service": "WFS",
              "version": "2.0.0",
              "request": "GetFeature",
              "typeNames": type_name,
              "count": "1",
              "outputFormat": "geopkg",
              "srsName": "EPSG:28992",
          }
          request = urllib.request.Request(
              base + "?" + urllib.parse.urlencode(params),
              headers={"User-Agent": "Enexis-QGIS-v0152-CI-probe"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read(64)
                  content_type = response.headers.get("Content-Type", "")
              supported = data.startswith(b"SQLite format 3\x00")
              print("ENEXIS_TYPE_NAME=" + type_name)
              print("ENEXIS_GEOPKG_CONTENT_TYPE=" + content_type)
              print("ENEXIS_GEOPKG_SUPPORTED=" + str(supported).lower())
          except Exception as exc:
              print("ENEXIS_TYPE_NAME=" + type_name)
              print("ENEXIS_GEOPKG_SUPPORTED=false")
              print("ENEXIS_GEOPKG_ERROR=" + repr(exc))
          PY
